<svg width="820" height="220" viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fmGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a8ff"/>
      <stop offset="55%" stop-color="#ae7aff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="fmGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ae7aff"/>
      <stop offset="100%" stop-color="#6a3fd6"/>
    </linearGradient>
    <linearGradient id="fmTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9c2ff"/>
      <stop offset="100%" stop-color="#ae7aff"/>
    </linearGradient>
    <filter id="fmGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- icon badge -->
  <g transform="translate(30,30)">
    <rect x="0" y="0" width="160" height="160" rx="38" fill="#141420"/>
    <rect x="0" y="0" width="160" height="160" rx="38" fill="none" stroke="url(#fmGrad1)" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- fusing shapes forming abstract F / orbit -->
    <g filter="url(#fmGlow)">
      <circle cx="63" cy="63" r="34" fill="url(#fmGrad1)" opacity="0.9"/>
      <circle cx="100" cy="100" r="34" fill="url(#fmGrad2)" opacity="0.85"/>
    </g>

    <!-- fused core mark -->
    <path d="M56 40 H112 C116.4 40 120 43.6 120 48 C120 52.4 116.4 56 112 56 H72 V78 H104 C108.4 78 112 81.6 112 86 C112 90.4 108.4 94 104 94 H72 V132 C72 136.4 68.4 140 64 140 C59.6 140 56 136.4 56 132 V40 Z"
            fill="#0b0b10"/>
    <path d="M56 40 H112 C116.4 40 120 43.6 120 48 C120 52.4 116.4 56 112 56 H72 V78 H104 C108.4 78 112 81.6 112 86 C112 90.4 108.4 94 104 94 H72 V132 C72 136.4 68.4 140 64 140 C59.6 140 56 136.4 56 132 V40 Z"
            fill="url(#fmTextGrad)"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(220,0)" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="0" y="112" font-size="58" font-weight="600" fill="#f2eeff">Fusion<tspan fill="url(#fmTextGrad)" font-weight="700">Media</tspan></text>
    <text x="2" y="145" font-size="16" letter-spacing="4" fill="#8b86a3">DIGITAL EXPERIENCES, FUSED</text>
  </g>
</svg>
